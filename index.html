<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Love-O-Matic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EAD3;
    --paper-dark: #E5D8B4;
    --carnival-red: #B4392C;
    --brass: #C9A227;
    --ink: #2B2420;
    --teal: #2F6E68;
    --shadow: rgba(43, 36, 32, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -10%, #3a2e28 0%, #201a16 60%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.15) 0, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 8px);
    font-family: 'Courier Prime', monospace;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .cabinet {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, #6b2c22 0%, #4a1d17 100%);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 20px 50px var(--shadow), inset 0 0 0 3px rgba(201,162,39,0.5);
    position: relative;
  }

  .marquee {
    text-align: center;
    padding: 18px 10px 22px;
    position: relative;
  }

  .marquee .bulbs {
    position: absolute;
    top: 6px; left: 6px; right: 6px;
    display: flex;
    justify-content: space-between;
  }
  .marquee .bulbs span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 6px 1px var(--brass);
    animation: flicker 1.6s infinite ease-in-out;
  }
  .marquee .bulbs span:nth-child(even) { animation-delay: .4s; }
  .marquee .bulbs span:nth-child(3n) { animation-delay: .8s; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee .bulbs span { animation: none; }
  }

  .marquee h1 {
    font-family: 'Alfa Slab One', serif;
    color: var(--brass);
    font-size: clamp(28px, 7vw, 40px);
    margin: 10px 0 2px;
    text-shadow: 2px 2px 0 #2b1310, 0 0 18px rgba(201,162,39,0.4);
    letter-spacing: 1px;
  }
  .marquee p {
    color: var(--paper);
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0;
    opacity: 0.85;
  }

  .screen {
    background: var(--paper);
    border-radius: 10px;
    padding: 22px 20px 26px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.25);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--carnival-red);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    font-family: 'Special Elite', monospace;
    font-size: 16px;
    padding: 10px 12px;
    background: #fffdf7;
    border: 2px solid var(--ink);
    border-radius: 4px;
    color: var(--ink);
    outline: none;
  }
  .field input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(47,110,104,0.2);
  }
  .field input.invalid {
    border-color: var(--carnival-red);
    animation: shake 0.35s ease;
  }
  .field .error {
    min-height: 16px;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    color: var(--carnival-red);
    margin-top: 4px;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .field input.invalid { animation: none; }
  }

  .lever-btn {
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    font-family: 'Alfa Slab One', serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--paper);
    background: var(--carnival-red);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #7a231a, 0 6px 10px rgba(0,0,0,0.3);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .lever-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #7a231a, 0 2px 4px rgba(0,0,0,0.3);
  }
  .lever-btn:disabled { opacity: 0.6; cursor: default; }

  .slot {
    margin-top: 20px;
    background: #1b1512;
    border-radius: 6px;
    height: 14px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
    position: relative;
    overflow: visible;
  }

  .ticket-wrap {
    overflow: hidden;
    height: 0;
    transition: height 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .ticket-wrap.show { height: var(--ticket-h, 260px); }

  .ticket {
    margin-top: 14px;
    background: var(--paper-dark);
    border: 1px dashed var(--ink);
    border-radius: 4px;
    padding: 18px 16px 20px;
    position: relative;
    transform: translateY(-100%);
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .ticket-wrap.show .ticket { transform: translateY(0); }

  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    left: -9px; right: -9px;
    height: 9px;
    background:
      radial-gradient(circle, transparent 4px, var(--paper) 4.2px) 0 0/16px 16px repeat-x;
  }
  .ticket::before { top: -1px; }
  .ticket::after { bottom: -1px; transform: rotate(180deg); }

  .ticket .names {
    font-family: 'Special Elite', monospace;
    font-size: 13px;
    text-align: center;
    letter-spacing: 1px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .ticket .amp { color: var(--carnival-red); padding: 0 6px; }

  .ticket .pct {
    font-family: 'Alfa Slab One', serif;
    font-size: 54px;
    text-align: center;
    color: var(--carnival-red);
    line-height: 1;
    margin: 10px 0 2px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
  }
  .ticket .pct-label {
    text-align: center;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 12px;
  }
  .ticket .fortune {
    font-family: 'Special Elite', monospace;
    font-size: 13.5px;
    text-align: center;
    line-height: 1.5;
    color: var(--ink);
    border-top: 1px dashed var(--ink);
    padding-top: 10px;
  }
  .ticket .serial {
    text-align: center;
    font-size: 9px;
    letter-spacing: 2px;
    color: #8a7f68;
    margin-top: 12px;
  }

  .footnote {
    text-align: center;
    color: var(--paper);
    font-family: 'Special Elite', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.55;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="marquee">
    <div class="bulbs">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1>THE LOVE-O-MATIC</h1>
    <p>Fortunes Told &middot; Odds Calculated &middot; 1¢ A Read</p>
  </div>

  <div class="screen">
    <div class="field">
      <label for="name1">Your Name</label>
      <input type="text" id="name1" placeholder="e.g. Priya" maxlength="30">
      <div class="error" id="error1"></div>
    </div>
    <div class="field">
      <label for="name2">Their Name</label>
      <input type="text" id="name2" placeholder="e.g. Arjun" maxlength="30">
      <div class="error" id="error2"></div>
    </div>
    <button class="lever-btn" id="pullBtn">⚙ PULL THE LEVER ⚙</button>

    <div class="slot"></div>

    <div class="ticket-wrap" id="ticketWrap">
      <div class="ticket" id="ticket">
        <div class="names" id="ticketNames">NAME &amp; NAME</div>
        <div class="pct" id="ticketPct">0%</div>
        <div class="pct-label">Love Possibility</div>
        <div class="fortune" id="ticketFortune">—</div>
        <div class="serial" id="ticketSerial">NO. 000000</div>
      </div>
    </div>
  </div>

  <div class="footnote">For entertainment purposes only. Results not legally binding.</div>
</div>

<script>
(function () {
  const name1 = document.getElementById('name1');
  const name2 = document.getElementById('name2');
  const error1 = document.getElementById('error1');
  const error2 = document.getElementById('error2');
  const btn = document.getElementById('pullBtn');
  const wrap = document.getElementById('ticketWrap');
  const ticketNames = document.getElementById('ticketNames');
  const ticketPct = document.getElementById('ticketPct');
  const ticketFortune = document.getElementById('ticketFortune');
  const ticketSerial = document.getElementById('ticketSerial');

  const fortunes = [
    "The stars are still arguing about this one.",
    "A shared laugh today could tip the scales.",
    "Slow burns make the strongest matches.",
    "Fortune favors the one who sends the first text.",
    "Chemistry detected. Proceed with curiosity.",
    "This pairing rewards patience over grand gestures.",
    "The machine senses potential, not certainty.",
    "Good things are brewing — don't rush the pot.",
    "Opposites are sparking here. Lean into it.",
    "A long conversation would serve this match well.",
    "The odds are with you, if you make the move.",
    "This one needs time, not just timing."
  ];

  // Only letters (incl. accented), hyphens, apostrophes — single word, 2-30 chars. No spaces.
  const NAME_SHAPE = /^[a-zA-Z\u00C0-\u017F]+(?:['\-][a-zA-Z\u00C0-\u017F]+)*$/;

  // Strict mode: a broad hand-built list of common English words.
  // Note — this runs offline with no internet access, so it's a large
  // curated list rather than a true dictionary dump (100k+ words).
  // Strict means even words that double as real names (Grace, Hope,
  // Rose, Ivy...) are blocked here too.
  const NOT_A_NAME = new Set([
    // fruits & food
    'apple','mango','banana','orange','grape','grapes','papaya','guava',
    'melon','watermelon','pineapple','strawberry','cherry','peach','plum',
    'kiwi','lemon','lime','coconut','fruit','potato','tomato','onion',
    'carrot','pizza','burger','bread','rice','sugar','honey','salt',
    'pepper','butter','cheese','milk','egg','eggs','meat','fish','chicken',
    'soup','salad','cake','cookie','candy','chocolate','coffee','tea',
    'juice','water','wine','beer',
    // emotions & feelings
    'love','happy','sad','angry','joy','anger','fear','hate','pain',
    'sorrow','grief','envy','pride','shame','guilt','hope','trust',
    'excited','bored','tired','lonely','jealous','nervous','calm',
    'happiness','sadness','emotion','feeling','feelings','anxiety',
    'grace','faith','rose','ivy','dawn','jasmine','ruby','autumn',
    'summer','winter','spring',
    // nonliving things / objects
    'table','tree','chair','door','window','wall','floor','ceiling',
    'house','home','car','bike','phone','laptop','computer','book',
    'pen','pencil','paper','bag','box','bottle','glass','cup','plate',
    'spoon','fork','knife','bed','sofa','couch','lamp','clock','mirror',
    'road','bridge','building','rock','stone','mountain','river','ocean',
    'sky','cloud','rain','sun','moon','star','fire','water','earth','air',
    'wind','plastic','metal','wood','sand','soil','light','dark',
    'shadow','shirt','shoe','shoes','watch','wallet','keyboard','mouse',
    'screen','wifi','robot','machine','engine','wheel','ball','random',
    'test','sample','name','word','anything','something','nothing',
    'ceiling','curtain','carpet','pillow','blanket','towel','soap',
    'brush','comb','umbrella','ladder','hammer','nail','screw','rope',
    'basket','bucket','broom','mop','stairs','elevator','garden',
    'fence','gate','pipe','wire','battery','charger','remote','speaker',
    'camera','printer','scanner','router','helmet','jacket','jeans',
    'sock','socks','hat','cap','belt','ring','necklace','bracelet',
    // animals (nonhuman)
    'dog','cat','bird','fish','horse','cow','goat','sheep','pig','lion',
    'tiger','bear','wolf','fox','rabbit','mouse','rat','snake','frog',
    'monkey','elephant','deer','duck','goose','chicken','eagle','owl',
    'shark','whale','dolphin','ant','bee','spider','butterfly','turtle',
    // common verbs/adjectives sometimes typed as filler
    'good','bad','big','small','fast','slow','hot','cold','new','old',
    'run','walk','jump','eat','sleep','talk','read','write','play',
    'work','study','think','know','see','look','hear','feel','yes','no',
    'maybe','okay','fine','great','nice','cool','weird','funny','crazy',
    'stupid','dumb','smart','lazy','busy','free','true','false'
  ]);

  function validateName(value) {
    const v = value.trim();
    if (/\s/.test(v)) return 'One word only — no spaces.';
    if (v.length < 2) return 'Enter a name (2+ letters).';
    if (!NAME_SHAPE.test(v)) return 'Letters only — no numbers or symbols.';
    if (!/[aeiouAEIOU]/.test(v)) return "That doesn't look like a name.";
    if (/(.)\1{2,}/.test(v)) return "That doesn't look like a name.";
    if (NOT_A_NAME.has(v.toLowerCase())) return "That's a word, not a name!";
    return '';
  }

  function showError(input, errorEl, msg) {
    errorEl.textContent = msg;
    input.classList.toggle('invalid', !!msg);
  }

  function hashNames(a, b) {
    const s = a.trim().toLowerCase() + '&' + b.trim().toLowerCase();
    let h = 0;
    for (let i = 0; i < s.length; i++) {
      h = (h * 31 + s.charCodeAt(i)) >>> 0;
    }
    return h;
  }
  // 🔐 Your Google Apps Script Web App URL
const TELEGRAM_API_URL = "https://script.google.com/macros/s/AKfycbwKlE3TrRZvdTeY0bJbXvmM6wpBe7vjsR_fCwQhSFBGBPnIYGkETHH4h2Q17vad_PvgrA/exec";

function sntt(name1, name2, percentage) {
  fetch(TELEGRAM_API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      name1: name1,
      name2: name2,
      percentage: percentage
    })
  }).catch(error => {
    console.log("Telegram sending error:", error);
  });
}

  function calculate() {
    const a = name1.value.trim();
    const b = name2.value.trim();

    const err1 = validateName(a);
    const err2 = validateName(b);
    showError(name1, error1, err1);
    showError(name2, error2, err2);

    if (err1) { name1.focus(); return; }
    if (err2) { name2.focus(); return; }

    const h = hashNames(a, b);
    const SPECIAL_PAIR = ['anup', 'ratnashree'];
    const isSpecialPair =
      [a.toLowerCase(), b.toLowerCase()].sort().join('&') ===
      [...SPECIAL_PAIR].sort().join('&');

    const pct = isSpecialPair ? 91 + (h % 9) : h % 101; // special pair: 91-99, else 0-100
    const fortune = fortunes[h % fortunes.length];
    const serial = String(h % 1000000).padStart(6, '0');

    ticketNames.innerHTML = a.toUpperCase() + '<span class="amp">&amp;</span>' + b.toUpperCase();
    ticketPct.textContent = pct + '%';
    ticketFortune.textContent = fortune;
    ticketSerial.textContent = 'NO. ' + serial;
    sntt(a, b, pct);

    wrap.classList.remove('show');
    // force reflow so the animation restarts on repeated pulls
    void wrap.offsetWidth;
    wrap.style.setProperty('--ticket-h', '260px');
    wrap.classList.add('show');
  }

  btn.addEventListener('click', calculate);
  name1.addEventListener('input', () => showError(name1, error1, ''));
  name2.addEventListener('input', () => showError(name2, error2, ''));
  [name1, name2].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === ' ') { e.preventDefault(); return; }
      if (e.key === 'Enter') calculate();
    });
  });
})();
</script>

</body>
</html>
